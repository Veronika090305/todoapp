name: CI/CD

# Запускается при КАЖДОМ коммите (push) в любую ветку и при создании Pull Request
on: [push, pull_request]

jobs:
  # Задача 1. Автоматический запуск тестов
  test:
    name: Запуск тестов
    runs-on: ubuntu-latest
    steps:
      - name: Получить код из репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest

      - name: Запустить тесты (pytest)
        run: python -m pytest -v

  # Задача 2. Автоматическая генерация документации
  # Выполняется только если тесты прошли (needs: test)
  docs:
    name: Генерация документации
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Получить код из репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install flask pdoc

      - name: Сгенерировать HTML-документацию из docstring'ов
        run: pdoc models.py app.py -o docs

      - name: Загрузить документацию как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs
